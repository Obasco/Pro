<body>

<nav class="navbar">

    </ul>

  <!-- ===== Contact Section ===== -->
<section class="contact-section">
  <h2>Contact Me</h2>
  <form id="contactForm" action="https://formspree.io/f/xldpywpk" method="POST">
    
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name">
      <small class="error" id="error-name"></small>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">
      <small class="error" id="error-email"></small>
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Enter subject">
      <small class="error" id="error-subject"></small>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message"></textarea>
      <small class="error" id="error-message"></small>
    </div>

    <button type="submit">Send Message</button>
    <p id="success-message" class="success" hidden>✅ Message sent successfully!</p>

  </form>
</section>


  <script src="Script.js"></script>
</body>
</html>
